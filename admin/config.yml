backend:
  name: github
  repo: marianoboragno/marianoboragno.github.io
  branch: main

# Dónde se guardan las imágenes que subas desde el panel
media_folder: "assets/img"
public_folder: "/assets/img"

# Colecciones de contenido
collections:
  - name: "noticias_puyo"
    label: "Noticias Puyo"
    folder: "noticias_puyo"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Imagen Destacada", name: "thumbnail", widget: "image", required: false }
      - { label: "Cuerpo de la Noticia", name: "body", widget: "markdown" }
